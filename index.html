<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus — Weather</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-top: #0d1b3e;
    --sky-mid: #1a3a6e;
    --sky-accent: #2c5fc4;
    --glass: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.13);
    --glass-hover: rgba(255,255,255,0.13);
    --text-primary: #f0f4ff;
    --text-muted: rgba(220,230,255,0.6);
    --text-hint: rgba(200,215,255,0.38);
    --card-radius: 20px;
    --accent: #5b9cf6;
    --accent-warm: #f4a95a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--sky-top);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  .sky-bg {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 120% 80% at 60% -20%, #1e4faa 0%, #0d1b3e 60%),
                radial-gradient(ellipse 60% 40% at 20% 90%, #0a1528 0%, transparent 70%);
  }

  .stars {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 8%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 30%, rgba(255,255,255,0.45) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 75%, rgba(255,255,255,0.45) 0%, transparent 100%);
  }

  .page {
    position: relative; z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .unit-toggle {
    display: flex;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 4px;
    gap: 2px;
  }

  .unit-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .unit-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 16px rgba(91,156,246,0.4);
  }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 40px;
  }

  .search-icon {
    position: absolute;
    left: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 18px;
  }

  .search-input {
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 400;
    padding: 18px 160px 18px 52px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    backdrop-filter: blur(12px);
  }

  .search-input::placeholder { color: var(--text-hint); }
  .search-input:focus {
    border-color: rgba(91,156,246,0.5);
    background: rgba(255,255,255,0.1);
  }

  .search-actions {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    display: flex; gap: 6px;
  }

  .btn-search, .btn-locate {
    border: none;
    border-radius: 11px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-search {
    background: var(--accent);
    color: #fff;
  }

  .btn-search:hover { background: #4a8ef0; transform: translateY(-1px); }

  .btn-locate {
    background: var(--glass-hover);
    color: var(--text-primary);
    border: 1px solid var(--glass-border);
  }

  .btn-locate:hover { background: rgba(255,255,255,0.18); }

  /* Main weather card */
  .main-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--card-radius);
    padding: 36px;
    margin-bottom: 20px;
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    display: none;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .main-card.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .main-card::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(91,156,246,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .location-line {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
    letter-spacing: 0.3px;
  }

  .location-dot {
    width: 6px; height: 6px;
    background: var(--accent-warm);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .weather-main {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 32px;
  }

  .temp-block {}

  .temp-big {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(72px, 12vw, 100px);
    line-height: 1;
    color: var(--text-primary);
    letter-spacing: -4px;
    margin-bottom: 6px;
  }

  .temp-feels {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .weather-cond {
    font-size: 17px;
    font-weight: 500;
    color: var(--text-primary);
    opacity: 0.9;
  }

  .weather-icon-big {
    font-size: 88px;
    line-height: 1;
    filter: drop-shadow(0 0 30px rgba(91,156,246,0.3));
    animation: floatIcon 4s ease-in-out infinite;
  }

  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    padding-top: 28px;
    border-top: 1px solid var(--glass-border);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .stat-sub {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Grid of secondary cards */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .mini-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--card-radius);
    padding: 22px;
    backdrop-filter: blur(16px);
    display: none;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .mini-card.visible { display: block; }

  .mini-card-label {
    font-size: 12px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mini-card-icon {
    font-size: 14px;
    opacity: 0.7;
  }

  /* Humidity bar */
  .humidity-bar-track {
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    height: 6px;
    margin: 16px 0 8px;
    overflow: hidden;
  }

  .humidity-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, #a78bfa 100%);
    border-radius: 4px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .humidity-num {
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -1px;
  }

  /* Wind compass */
  .wind-big {
    font-size: 36px;
    font-weight: 500;
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .wind-dir {
    font-size: 14px;
    color: var(--text-muted);
  }

  /* UV index */
  .uv-row {
    display: flex;
    gap: 6px;
    margin-top: 14px;
  }

  .uv-dot {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.1);
  }

  .uv-dot.active { background: var(--accent-warm); }
  .uv-dot.high { background: #f87171; }

  /* Forecast card */
  .forecast-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--card-radius);
    padding: 28px;
    margin-bottom: 20px;
    backdrop-filter: blur(16px);
    display: none;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .forecast-card.visible { display: block; }

  .section-label {
    font-size: 12px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 20px;
  }

  .forecast-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .forecast-row::-webkit-scrollbar { display: none; }

  .forecast-day {
    flex: 0 0 calc(14.28% - 7px);
    min-width: 78px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    transition: background 0.2s;
  }

  .forecast-day:hover { background: rgba(255,255,255,0.1); }
  .forecast-day.today {
    border-color: rgba(91,156,246,0.4);
    background: rgba(91,156,246,0.1);
  }

  .forecast-day-name {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .forecast-icon { font-size: 26px; margin-bottom: 8px; }

  .forecast-high {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .forecast-low {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Loading */
  .loading-wrap {
    display: none;
    text-align: center;
    padding: 48px 0;
  }

  .loading-wrap.visible { display: block; }

  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--glass-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 15px;
    color: var(--text-muted);
  }

  /* Error */
  .error-msg {
    display: none;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 14px;
    padding: 18px 22px;
    font-size: 15px;
    color: #fca5a5;
    margin-bottom: 20px;
    animation: slideUp 0.3s ease forwards;
  }

  .error-msg.visible { display: block; }

  /* Datetime strip */
  .datetime-strip {
    text-align: right;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--text-hint);
    letter-spacing: 0.3px;
  }

  @media (max-width: 500px) {
    .page { padding: 28px 16px 60px; }
    .search-input { padding: 16px 12px 16px 46px; font-size: 15px; }
    .search-actions { position: static; transform: none; margin-top: 10px; display: flex; }
    .search-wrap { }
    .temp-big { font-size: 72px; }
    .weather-icon-big { font-size: 60px; }
  }
</style>
</head>
<body>

<div class="sky-bg"></div>
<div class="stars"></div>

<div class="page">

  <header class="header">
    <div class="logo">
      <div class="logo-dot"></div>
      Nimbus
    </div>
    <div class="unit-toggle">
      <button class="unit-btn active" id="btnC" onclick="setUnit('C')">°C</button>
      <button class="unit-btn" id="btnF" onclick="setUnit('F')">°F</button>
    </div>
  </header>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      class="search-input"
      id="locInput"
      placeholder="Search city, region, or ZIP…"
      onkeydown="if(event.key==='Enter')fetchWeather()"
    />
    <div class="search-actions">
      <button class="btn-search" onclick="fetchWeather()">Search</button>
      <button class="btn-locate" onclick="useLocation()" title="Use my location">📍</button>
    </div>
  </div>

  <div class="loading-wrap" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Fetching weather data…</div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <!-- Main card -->
  <div class="main-card" id="mainCard">
    <div class="location-line">
      <div class="location-dot"></div>
      <span id="locationName">—</span>
      <span id="localTime" style="margin-left:auto; font-size:13px;"></span>
    </div>
    <div class="weather-main">
      <div class="temp-block">
        <div class="temp-big" id="tempBig">—</div>
        <div class="temp-feels" id="feelsLike">Feels like —</div>
        <div class="weather-cond" id="condText">—</div>
      </div>
      <div class="weather-icon-big" id="weatherIcon">🌤️</div>
    </div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-label">High / Low</div>
        <div class="stat-value" id="highLow">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Sunrise</div>
        <div class="stat-value" id="sunrise" style="font-size:18px;">—</div>
        <div class="stat-sub" id="sunset">Sunset —</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Visibility</div>
        <div class="stat-value" id="visibility">—</div>
        <div class="stat-sub">km</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Pressure</div>
        <div class="stat-value" id="pressure">—</div>
        <div class="stat-sub">hPa</div>
      </div>
    </div>
  </div>

  <!-- Secondary grid -->
  <div class="cards-grid">

    <div class="mini-card" id="cardHumidity">
      <div class="mini-card-label"><span class="mini-card-icon">💧</span> Humidity</div>
      <div class="humidity-num" id="humidityNum">—%</div>
      <div class="humidity-bar-track">
        <div class="humidity-bar-fill" id="humidityBar" style="width:0%"></div>
      </div>
      <div style="font-size:13px; color:var(--text-muted)" id="humidityDesc">—</div>
    </div>

    <div class="mini-card" id="cardWind">
      <div class="mini-card-label"><span class="mini-card-icon">💨</span> Wind</div>
      <div class="wind-big" id="windSpeed">—</div>
      <div class="wind-dir" id="windDir">— km/h</div>
      <div style="margin-top:12px; font-size:13px; color:var(--text-muted)" id="gustVal">Gusts —</div>
    </div>

    <div class="mini-card" id="cardUV">
      <div class="mini-card-label"><span class="mini-card-icon">☀️</span> UV Index</div>
      <div class="humidity-num" id="uvNum">—</div>
      <div class="uv-row" id="uvRow"></div>
      <div style="margin-top:8px; font-size:13px; color:var(--text-muted)" id="uvDesc">—</div>
    </div>

    <div class="mini-card" id="cardPrecip">
      <div class="mini-card-label"><span class="mini-card-icon">🌧️</span> Precipitation</div>
      <div class="humidity-num" id="precipVal">—</div>
      <div style="font-size:13px; color:var(--text-muted); margin-top:6px">mm today</div>
      <div style="margin-top:14px; font-size:13px; color:var(--text-muted)" id="precipProb">Chance: —</div>
    </div>

  </div>

  <!-- 7-day forecast -->
  <div class="forecast-card" id="forecastCard">
    <div class="section-label">7-day forecast</div>
    <div class="forecast-row" id="forecastRow"></div>
  </div>

</div>

<script>
  const API_KEY = 'C6FP8X8MGXVBETDN52TQJ3NRW'; // Replace with your Visual Crossing API key
  let unit = 'C';
  let lastData = null;

  function setUnit(u) {
    unit = u;
    document.getElementById('btnC').classList.toggle('active', u === 'C');
    document.getElementById('btnF').classList.toggle('active', u === 'F');
    if (lastData) renderAll(lastData);
  }

  function toDisplay(f) {
    if (unit === 'C') return ((f - 32) * 5/9).toFixed(1) + '°C';
    return f.toFixed(1) + '°F';
  }

  function toDisplayShort(f) {
    if (unit === 'C') return Math.round((f - 32) * 5/9) + '°';
    return Math.round(f) + '°';
  }

  function condIcon(cond) {
    const c = (cond || '').toLowerCase();
    if (c.includes('thunder')) return '⛈️';
    if (c.includes('snow') || c.includes('sleet')) return '❄️';
    if (c.includes('rain') || c.includes('drizzle') || c.includes('shower')) return '🌧️';
    if (c.includes('fog') || c.includes('mist') || c.includes('haze')) return '🌫️';
    if (c.includes('overcast')) return '☁️';
    if (c.includes('cloud') || c.includes('partly')) return '⛅';
    return '☀️';
  }

  function uvLevel(uv) {
    if (uv <= 2) return { label: 'Low', cls: '' };
    if (uv <= 5) return { label: 'Moderate', cls: '' };
    if (uv <= 7) return { label: 'High', cls: 'high' };
    if (uv <= 10) return { label: 'Very High', cls: 'high' };
    return { label: 'Extreme', cls: 'high' };
  }

  function humDesc(h) {
    if (h < 30) return 'Very dry';
    if (h < 50) return 'Comfortable';
    if (h < 70) return 'Moderate';
    return 'Humid';
  }

  function fmtTime(t) {
    if (!t) return '—';
    return t.slice(0, 5);
  }

  function dayName(dateStr, i) {
    if (i === 0) return 'Today';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en', { weekday: 'short' });
  }

  function renderAll(data) {
    const c = data.currentConditions;
    const d = data.days[0];

    document.getElementById('locationName').textContent = data.resolvedAddress;
    document.getElementById('localTime').textContent = c.datetime ? fmtTime(c.datetime) + ' local' : '';

    document.getElementById('tempBig').textContent = toDisplay(c.temp);
    document.getElementById('feelsLike').textContent = 'Feels like ' + toDisplay(c.feelslike);
    document.getElementById('condText').textContent = c.conditions || '—';
    document.getElementById('weatherIcon').textContent = condIcon(c.conditions);

    document.getElementById('highLow').textContent = toDisplayShort(d.tempmax) + ' / ' + toDisplayShort(d.tempmin);
    document.getElementById('sunrise').textContent = fmtTime(d.sunrise);
    document.getElementById('sunset').textContent = 'Sunset ' + fmtTime(d.sunset);
    document.getElementById('visibility').textContent = (c.visibility || d.visibility || '—');
    document.getElementById('pressure').textContent = Math.round(c.pressure || d.pressure || 0);

    const hum = Math.round(c.humidity || 0);
    document.getElementById('humidityNum').textContent = hum + '%';
    document.getElementById('humidityBar').style.width = hum + '%';
    document.getElementById('humidityDesc').textContent = humDesc(hum);

    const wspeed = (c.windspeed || 0).toFixed(1);
    document.getElementById('windSpeed').textContent = wspeed;
    document.getElementById('windDir').textContent = (c.winddir ? c.winddir + '° · ' : '') + 'km/h';
    const gust = c.windgust || d.windgust;
    document.getElementById('gustVal').textContent = gust ? 'Gusts ' + gust.toFixed(1) + ' km/h' : 'Gusts —';

    const uv = Math.round(c.uvindex || d.uvindex || 0);
    document.getElementById('uvNum').textContent = uv;
    const uvInfo = uvLevel(uv);
    document.getElementById('uvDesc').textContent = uvInfo.label;
    const uvRow = document.getElementById('uvRow');
    uvRow.innerHTML = '';
    for (let i = 0; i < 11; i++) {
      const dot = document.createElement('div');
      dot.className = 'uv-dot' + (i < uv ? (' active' + (uv > 7 ? ' high' : '')) : '');
      uvRow.appendChild(dot);
    }

    const precip = (d.precip || 0).toFixed(1);
    document.getElementById('precipVal').textContent = precip + ' mm';
    const prob = d.precipprob != null ? Math.round(d.precipprob) + '%' : '—';
    document.getElementById('precipProb').textContent = 'Chance: ' + prob;

    // 7-day forecast
    const fcRow = document.getElementById('forecastRow');
    fcRow.innerHTML = '';
    data.days.slice(0, 7).forEach((day, i) => {
      const el = document.createElement('div');
      el.className = 'forecast-day' + (i === 0 ? ' today' : '');
      el.innerHTML = `
        <div class="forecast-day-name">${dayName(day.datetime, i)}</div>
        <div class="forecast-icon">${condIcon(day.conditions)}</div>
        <div class="forecast-high">${toDisplayShort(day.tempmax)}</div>
        <div class="forecast-low">${toDisplayShort(day.tempmin)}</div>
      `;
      fcRow.appendChild(el);
    });

    showCards();
  }

  function showCards() {
    ['mainCard', 'cardHumidity', 'cardWind', 'cardUV', 'cardPrecip', 'forecastCard'].forEach((id, i) => {
      const el = document.getElementById(id);
      setTimeout(() => {
        el.classList.add('visible');
        el.style.animationDelay = '0s';
      }, i * 60);
    });
  }

  function hideCards() {
    ['mainCard', 'cardHumidity', 'cardWind', 'cardUV', 'cardPrecip', 'forecastCard'].forEach(id => {
      document.getElementById(id).classList.remove('visible');
    });
  }

  function setLoading(v) {
    document.getElementById('loading').classList.toggle('visible', v);
  }

  function setError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.toggle('visible', !!msg);
  }

  async function fetchWeather(lat, lon) {
    const loc = lat != null
      ? `${lat},${lon}`
      : (document.getElementById('locInput').value.trim() || 'London');

    if (!loc) { setError('Please enter a location.'); return; }
    hideCards();
    setError('');
    setLoading(true);

    const url = `https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/${encodeURIComponent(loc)}?unitGroup=us&include=days,current&key=${API_KEY}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Location not found or API key invalid.');
      const data = await res.json();
      lastData = data;
      renderAll(data);
    } catch (e) {
      setError('⚠️ ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  function useLocation() {
    if (!navigator.geolocation) { setError('Geolocation not supported.'); return; }
    hideCards(); setError(''); setLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
      () => { setLoading(false); setError('Could not get your location.'); }
    );
  }

  // Auto-load a default city
  document.getElementById('locInput').value = 'Mysuru';
  fetchWeather();
</script>

</body>
</html>
