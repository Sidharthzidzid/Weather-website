<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus — Weather</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-top: #0d1b3e;
    --glass: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.13);
    --glass-hover: rgba(255,255,255,0.13);
    --text-primary: #f0f4ff;
    --text-muted: rgba(220,230,255,0.6);
    --text-hint: rgba(200,215,255,0.38);
    --card-radius: 20px;
    --accent: #5b9cf6;
    --accent-warm: #f4a95a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--sky-top);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    transition: background 1.2s ease;
  }

  .sky-bg {
    position: fixed; inset: 0; z-index: 0;
    transition: opacity 1.2s ease;
  }

  .sky-sunny {
    background: radial-gradient(ellipse 100% 70% at 70% -10%, #ff9f43 0%, #f7c59f 30%, #1a8fe3 60%, #0d4a8a 100%);
  }
  .sky-cloudy {
    background: radial-gradient(ellipse 120% 80% at 50% -20%, #5a7fa8 0%, #3a5f82 40%, #1e3a5f 100%);
  }
  .sky-rainy {
    background: radial-gradient(ellipse 120% 80% at 50% -20%, #2c3e50 0%, #1a2a3a 50%, #0d1b2a 100%);
  }
  .sky-thunder {
    background: radial-gradient(ellipse 120% 80% at 50% -20%, #1a1a2e 0%, #16213e 50%, #0f0f1e 100%);
  }
  .sky-snow {
    background: radial-gradient(ellipse 120% 80% at 50% -20%, #c5d8e8 0%, #8aafc7 40%, #4a7fa5 100%);
  }
  .sky-fog {
    background: radial-gradient(ellipse 120% 80% at 50% 30%, #8899aa 0%, #667788 40%, #445566 100%);
  }
  .sky-night {
    background: radial-gradient(ellipse 120% 80% at 60% -20%, #1e4faa 0%, #0d1b3e 60%),
                radial-gradient(ellipse 60% 40% at 20% 90%, #0a1528 0%, transparent 70%);
  }

  .stars {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 8%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 30%, rgba(255,255,255,0.45) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 75%, rgba(255,255,255,0.45) 0%, transparent 100%);
    transition: opacity 1.2s ease;
  }

  #weatherCanvas {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  .page {
    position: relative; z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .unit-toggle {
    display: flex;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 4px;
    gap: 2px;
  }

  .unit-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .unit-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 16px rgba(91,156,246,0.4);
  }

  /* ============ SAVED LOCATIONS ============ */
  .saved-btn {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 8px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    position: relative;
  }
  .saved-btn:hover { background: var(--glass-hover); }

  .saved-panel {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 300px;
    background: rgba(13,27,62,0.97);
    border: 1px solid var(--glass-border);
    border-radius: var(--card-radius);
    backdrop-filter: blur(24px);
    z-index: 100;
    padding: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }

  .saved-panel.open { display: block; animation: dropIn 0.2s ease; }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .saved-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .saved-panel-title {
    font-size: 13px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
  }

  .saved-location-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 14px;
  }

  .saved-location-item:hover { background: var(--glass-hover); }
  .saved-loc-name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saved-loc-temp { color: var(--text-muted); font-size: 13px; flex-shrink: 0; }

  .saved-loc-del {
    opacity: 0;
    background: none;
    border: none;
    color: #f87171;
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .saved-location-item:hover .saved-loc-del { opacity: 1; }

  .no-saved {
    text-align: center;
    color: var(--text-hint);
    font-size: 14px;
    padding: 20px 0;
  }

  .save-current-btn {
    margin-top: 12px;
    width: 100%;
    background: rgba(91,156,246,0.15);
    border: 1px solid rgba(91,156,246,0.3);
    border-radius: 12px;
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .save-current-btn:hover { background: rgba(91,156,246,0.25); }
  .save-current-btn:disabled { opacity: 0.4; cursor: default; }

  /* ============ SEARCH ============ */
  .search-wrap {
    position: relative;
    margin-bottom: 40px;
  }

  .search-icon {
    position: absolute;
    left: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 18px;
  }

  .search-input {
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 400;
    padding: 18px 170px 18px 52px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    backdrop-filter: blur(12px);
  }

  .search-input::placeholder { color: var(--text-hint); }
  .search-input:focus {
    border-color: rgba(91,156,246,0.5);
    background: rgba(255,255,255,0.1);
  }

  .search-actions {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    display: flex; gap: 6px;
  }

  .btn-search, .btn-locate {
    border: none;
    border-radius: 11px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-search { background: var(--accent); color: #fff; }
  .btn-search:hover { background: #4a8ef0; transform: translateY(-1px); }

  .btn-locate {
    background: var(--glass-hover);
    color: var(--text-primary);
    border: 1px solid var(--glass-border);
  }
  .btn-locate:hover { background: rgba(255,255,255,0.18); }

  /* ============ WEATHER ICON ============ */
  .weather-icon-big {
    position: relative;
    width: 110px;
    height: 110px;
    flex-shrink: 0;
  }

  .weather-icon-big svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 24px rgba(91,156,246,0.4));
  }

  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes sunRaysRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes cloudDrift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(6px); }
  }

  @keyframes lightningFlash {
    0%, 88%, 100% { opacity: 0; }
    90%, 96% { opacity: 1; }
    93%, 98% { opacity: 0.3; }
  }

  /* ============ MAIN CARD ============ */
  .main-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--card-radius);
    padding: 36px;
    margin-bottom: 20px;
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    display: none;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .main-card.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .main-card::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(91,156,246,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .location-line {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
    letter-spacing: 0.3px;
  }

  .location-dot {
    width: 6px; height: 6px;
    background: var(--accent-warm);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .weather-main {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 32px;
  }

  .temp-big {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(72px, 12vw, 100px);
    line-height: 1;
    color: var(--text-primary);
    letter-spacing: -4px;
    margin-bottom: 6px;
  }

  .temp-feels { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
  .weather-cond { font-size: 17px; font-weight: 500; color: var(--text-primary); opacity: 0.9; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    padding-top: 28px;
    border-top: 1px solid var(--glass-border);
  }

  .stat-item { display: flex; flex-direction: column; gap: 6px; }

  .stat-label {
    font-size: 12px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .stat-sub { font-size: 13px; color: var(--text-muted); }

  /* ============ MINI CARDS ============ */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .mini-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--card-radius);
    padding: 22px;
    backdrop-filter: blur(16px);
    display: none;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .mini-card.visible { display: block; }

  .mini-card-label {
    font-size: 12px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mini-card-icon { font-size: 14px; opacity: 0.7; }

  .humidity-bar-track {
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    height: 6px;
    margin: 16px 0 8px;
    overflow: hidden;
  }

  .humidity-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, #a78bfa 100%);
    border-radius: 4px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .humidity-num {
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -1px;
  }

  .wind-big {
    font-size: 36px;
    font-weight: 500;
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .wind-dir { font-size: 14px; color: var(--text-muted); }

  .uv-row { display: flex; gap: 6px; margin-top: 14px; }

  .uv-dot {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.1);
  }

  .uv-dot.active { background: var(--accent-warm); }
  .uv-dot.high { background: #f87171; }

  /* ============ FORECAST ============ */
  .forecast-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--card-radius);
    padding: 28px;
    margin-bottom: 20px;
    backdrop-filter: blur(16px);
    display: none;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .forecast-card.visible { display: block; }

  .section-label {
    font-size: 12px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 20px;
  }

  .forecast-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .forecast-row::-webkit-scrollbar { display: none; }

  .forecast-day {
    flex: 0 0 calc(14.28% - 7px);
    min-width: 78px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    transition: background 0.2s;
  }

  .forecast-day:hover { background: rgba(255,255,255,0.1); }
  .forecast-day.today { border-color: rgba(91,156,246,0.4); background: rgba(91,156,246,0.1); }

  .forecast-day-name { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
  .forecast-icon { font-size: 26px; margin-bottom: 8px; }
  .forecast-high { font-size: 16px; font-weight: 500; margin-bottom: 2px; }
  .forecast-low { font-size: 13px; color: var(--text-muted); }

  /* ============ LOADING & ERROR ============ */
  .loading-wrap { display: none; text-align: center; padding: 48px 0; }
  .loading-wrap.visible { display: block; }

  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--glass-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { font-size: 15px; color: var(--text-muted); }

  .error-msg {
    display: none;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 14px;
    padding: 18px 22px;
    font-size: 15px;
    color: #fca5a5;
    margin-bottom: 20px;
    animation: slideUp 0.3s ease forwards;
  }

  .error-msg.visible { display: block; }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(15,30,60,0.97);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 14px;
    color: var(--text-primary);
    backdrop-filter: blur(16px);
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 500px) {
    .page { padding: 28px 16px 60px; }
    .search-input { padding: 16px 12px 16px 46px; font-size: 15px; }
    .search-actions { position: static; transform: none; margin-top: 10px; display: flex; }
    .temp-big { font-size: 72px; }
    .saved-panel { width: 260px; }
    .header-right { gap: 8px; }
    .saved-btn span.label { display: none; }
  }
</style>
</head>
<body>

<div class="sky-bg sky-night" id="skyBg"></div>
<div class="stars" id="stars"></div>
<canvas id="weatherCanvas"></canvas>

<div class="page">

  <header class="header">
    <div class="logo">
      <div class="logo-dot"></div>
      Nimbus
    </div>
    <div class="header-right">
      <div style="position:relative;">
        <button class="saved-btn" id="savedBtn" onclick="toggleSavedPanel()">
          🔖 <span class="label">Saved</span>
          <span id="savedCount" style="background:var(--accent);border-radius:50%;width:18px;height:18px;font-size:11px;display:none;align-items:center;justify-content:center;font-weight:600;"></span>
        </button>
        <div class="saved-panel" id="savedPanel">
          <div class="saved-panel-header">
            <div class="saved-panel-title">Saved Locations</div>
          </div>
          <div id="savedList"><div class="no-saved">No saved locations yet.</div></div>
          <button class="save-current-btn" id="saveCurrentBtn" onclick="saveCurrentLocation()" disabled>
            ＋ Save current location
          </button>
        </div>
      </div>
      <div class="unit-toggle">
        <button class="unit-btn active" id="btnC" onclick="setUnit('C')">°C</button>
        <button class="unit-btn" id="btnF" onclick="setUnit('F')">°F</button>
      </div>
    </div>
  </header>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      class="search-input"
      id="locInput"
      placeholder="Search city, region, or ZIP…"
      onkeydown="if(event.key==='Enter')fetchWeather()"
    />
    <div class="search-actions">
      <button class="btn-search" onclick="fetchWeather()">Search</button>
      <button class="btn-locate" onclick="useLocation()" title="Use my location">📍</button>
    </div>
  </div>

  <div class="loading-wrap" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Detecting your location…</div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="main-card" id="mainCard">
    <div class="location-line">
      <div class="location-dot"></div>
      <span id="locationName">—</span>
      <span id="localTime" style="margin-left:auto; font-size:13px;"></span>
    </div>
    <div class="weather-main">
      <div class="temp-block">
        <div class="temp-big" id="tempBig">—</div>
        <div class="temp-feels" id="feelsLike">Feels like —</div>
        <div class="weather-cond" id="condText">—</div>
      </div>
      <div class="weather-icon-big" id="weatherIconBox"></div>
    </div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-label">High / Low</div>
        <div class="stat-value" id="highLow">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Sunrise</div>
        <div class="stat-value" id="sunrise" style="font-size:18px;">—</div>
        <div class="stat-sub" id="sunset">Sunset —</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Visibility</div>
        <div class="stat-value" id="visibility">—</div>
        <div class="stat-sub">km</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Pressure</div>
        <div class="stat-value" id="pressure">—</div>
        <div class="stat-sub">hPa</div>
      </div>
    </div>
  </div>

  <div class="cards-grid">
    <div class="mini-card" id="cardHumidity">
      <div class="mini-card-label"><span class="mini-card-icon">💧</span> Humidity</div>
      <div class="humidity-num" id="humidityNum">—%</div>
      <div class="humidity-bar-track">
        <div class="humidity-bar-fill" id="humidityBar" style="width:0%"></div>
      </div>

  // ============ WEATHER TYPE ============
  function getWeatherType(cond, isNight) {
    const c = (cond || '').toLowerCase();
    if (c.includes('thunder') || c.includes('lightning')) return 'thunder';
    if (c.includes('snow') || c.includes('sleet') || c.includes('blizzard')) return 'snow';
    if (c.includes('rain') || c.includes('drizzle') || c.includes('shower')) return 'rain';
    if (c.includes('fog') || c.includes('mist') || c.includes('haze') || c.includes('smoke')) return 'fog';
    if (c.includes('overcast')) return 'overcast';
    if (c.includes('cloud') || c.includes('partly')) return 'cloudy';
    if (isNight) return 'night';
    return 'sunny';
  }

  function isNightTime(data) {
    const t = data.currentConditions && data.currentConditions.datetime;
    if (!t) return false;
    const h = parseInt(t.split(':')[0]);
    return h < 6 || h >= 20;
  }

    skyBg.classList.add(map[type] || 'sky-night');
    stars.style.opacity = (type === 'night' || type === 'thunder') ? '1' : '0';

  // ============ CANVAS PARTICLES ============
  const canvas = document.getElementById('weatherCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function clearAnim() {
    cancelAnimationFrame(animFrame);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = [];
  }

  function initParticles(type) {
    clearAnim();
    if (type === 'rain' || type === 'thunder') {
      const n = type === 'thunder' ? 200 : 130;
      for (let i = 0; i < n; i++) particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        len: Math.random() * 20 + 12,
        speed: Math.random() * 9 + 10,
        opacity: Math.random() * 0.4 + 0.15,
        width: Math.random() * 1.2 + 0.4
      });
      animateRain(type);
    } else if (type === 'snow') {
      for (let i = 0; i < 90; i++) particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 3.5 + 1,
        speed: Math.random() * 1.5 + 0.4,
        drift: (Math.random() - 0.5) * 0.6,
        opacity: Math.random() * 0.7 + 0.3,
        wobble: Math.random() * Math.PI * 2
      });
      animateSnow();
    } else if (type === 'fog') {
      for (let i = 0; i < 7; i++) particles.push({
        x: (Math.random() - 0.5) * canvas.width,
        y: canvas.height * 0.25 + Math.random() * canvas.height * 0.55,
        w: canvas.width * (0.5 + Math.random() * 0.7),
        h: 50 + Math.random() * 80,
        speed: (Math.random() * 0.25 + 0.08) * (Math.random() > 0.5 ? 1 : -1),
        opacity: Math.random() * 0.07 + 0.03
      });
      animateFog();
    } else if (type === 'sunny') {
      for (let i = 0; i < 8; i++) particles.push({
        angle: (i / 8) * Math.PI * 2,
        speed: 0.0015,
        opacity: 0.03 + Math.random() * 0.04
      });
      animateSunRays();
    }
  }

  function animateRain(type) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (type === 'thunder' && Math.random() < 0.004) {
      ctx.fillStyle = 'rgba(200,220,255,0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.save();
    particles.forEach(p => {
      ctx.beginPath();
      ctx.lineWidth = p.width;
      ctx.globalAlpha = p.opacity;
      ctx.strokeStyle = type === 'thunder' ? 'rgba(140,180,255,0.5)' : 'rgba(120,165,220,0.4)';
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.len * 0.18, p.y + p.len);
      ctx.stroke();
      p.y += p.speed;
      p.x -= p.speed * 0.18;
      if (p.y > canvas.height || p.x < -20) {
        p.x = Math.random() * (canvas.width + 50);
        p.y = -p.len;
      }
    });
    ctx.restore();
    animFrame = requestAnimationFrame(() => animateRain(type));
  }

  function animateSnow() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
      ctx.fill();
      p.y += p.speed;
      p.wobble += 0.025;
      p.x += Math.sin(p.wobble) * 0.6 + p.drift;
      if (p.y > canvas.height + 5) { p.y = -5; p.x = Math.random() * canvas.width; }
      if (p.x > canvas.width + 5) p.x = -5;
      if (p.x < -5) p.x = canvas.width + 5;
    });
    animFrame = requestAnimationFrame(animateSnow);
  }

  function animateFog() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      const grd = ctx.createRadialGradient(p.x + p.w/2, p.y, 0, p.x + p.w/2, p.y, p.w * 0.6);
      grd.addColorStop(0, `rgba(160,180,200,${p.opacity})`);
      grd.addColorStop(1, 'rgba(160,180,200,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(p.x, p.y - p.h/2, p.w, p.h);
      p.x += p.speed;
      if (p.x > canvas.width + p.w) p.x = -p.w;
      if (p.x < -p.w) p.x = canvas.width;
    });
    animFrame = requestAnimationFrame(animateFog);
  }

  function animateSunRays() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width * 0.85, cy = -30;
    particles.forEach(p => {
      p.angle += p.speed;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(p.angle) * canvas.width * 1.8, cy + Math.sin(p.angle) * canvas.height * 2);
      ctx.lineWidth = 100;
      ctx.strokeStyle = `rgba(255,220,80,${p.opacity})`;
      ctx.stroke();
    });
    animFrame = requestAnimationFrame(animateSunRays);
  }

  // ============ DATA ============
  function setUnit(u) {
    unit = u;
    document.getElementById('btnC').classList.toggle('active', u === 'C');
    document.getElementById('btnF').classList.toggle('active', u === 'F');
    if (lastData) renderAll(lastData);
  }

  function toDisplay(f) {
    return unit === 'C' ? ((f - 32) * 5/9).toFixed(1) + '°C' : f.toFixed(1) + '°F';
  }

  function toDisplayShort(f) {
    return unit === 'C' ? Math.round((f - 32) * 5/9) + '°' : Math.round(f) + '°';
  }

  function condIcon(cond) {
    const c = (cond || '').toLowerCase();
    if (c.includes('thunder')) return '⛈️';
    if (c.includes('snow') || c.includes('sleet')) return '❄️';
    if (c.includes('rain') || c.includes('drizzle') || c.includes('shower')) return '🌧️';
    if (c.includes('fog') || c.includes('mist') || c.includes('haze')) return '🌫️';
    if (c.includes('overcast')) return '☁️';
    if (c.includes('cloud') || c.includes('partly')) return '⛅';
    return '☀️';
  }

  function uvLevel(uv) {
    if (uv <= 2) return 'Low';
    if (uv <= 5) return 'Moderate';
    if (uv <= 7) return 'High';
    if (uv <= 10) return 'Very High';
    return 'Extreme';
  }

  function humDesc(h) {
    if (h < 30) return 'Very dry';
    if (h < 50) return 'Comfortable';
    if (h < 70) return 'Moderate';
    return 'Humid';
  }

  function fmtTime(t) { return t ? t.slice(0, 5) : '—'; }

  function dayName(dateStr, i) {
    if (i === 0) return 'Today';
    return new Date(dateStr).toLocaleDateString('en', { weekday: 'short' });
  }

  // Show place name cleanly — never raw lat/lon
  function formatLocationName(addr) {
    if (!addr) return 'Current Location';
    if (/^-?\d+\.?\d*,\s*-?\d+\.?\d*$/.test(addr.trim())) return 'Current Location';
    // Keep only first 2-3 parts (city, region, country)
    const parts = addr.split(',').map(s => s.trim()).filter(Boolean);
    return parts.slice(0, 3).join(', ');
  }

  function renderAll(data) {
    const c = data.currentConditions;
    const d = data.days[0];
    const night = isNightTime(data);
    const wType = getWeatherType(c.conditions, night);

    updateSkyBg(wType);
    initParticles(wType);
    document.getElementById('weatherIconBox').innerHTML = getSVGIcon(wType);

    document.getElementById('locationName').textContent = formatLocationName(data.resolvedAddress);
    document.getElementById('localTime').textContent = c.datetime ? fmtTime(c.datetime) + ' local' : '';

    document.getElementById('tempBig').textContent = toDisplay(c.temp);
    document.getElementById('feelsLike').textContent = 'Feels like ' + toDisplay(c.feelslike);
    document.getElementById('condText').textContent = c.conditions || '—';

    document.getElementById('highLow').textContent = toDisplayShort(d.tempmax) + ' / ' + toDisplayShort(d.tempmin);
    document.getElementById('sunrise').textContent = fmtTime(d.sunrise);
    document.getElementById('sunset').textContent = 'Sunset ' + fmtTime(d.sunset);
    document.getElementById('visibility').textContent = c.visibility || d.visibility || '—';
    document.getElementById('pressure').textContent = Math.round(c.pressure || d.pressure || 0);

    const hum = Math.round(c.humidity || 0);
    document.getElementById('humidityNum').textContent = hum + '%';
    document.getElementById('humidityBar').style.width = hum + '%';
    document.getElementById('humidityDesc').textContent = humDesc(hum);

    document.getElementById('windSpeed').textContent = (c.windspeed || 0).toFixed(1);
    document.getElementById('windDir').textContent = (c.winddir ? c.winddir + '° · ' : '') + 'km/h';
    const gust = c.windgust || d.windgust;
    document.getElementById('gustVal').textContent = gust ? 'Gusts ' + gust.toFixed(1) + ' km/h' : 'Gusts —';

    const uv = Math.round(c.uvindex || d.uvindex || 0);
    document.getElementById('uvNum').textContent = uv;
    document.getElementById('uvDesc').textContent = uvLevel(uv);
    const uvRow = document.getElementById('uvRow');
    uvRow.innerHTML = '';
    for (let i = 0; i < 11; i++) {
      const dot = document.createElement('div');
      dot.className = 'uv-dot' + (i < uv ? (' active' + (uv > 7 ? ' high' : '')) : '');
      uvRow.appendChild(dot);
    }

    document.getElementById('precipVal').textContent = (d.precip || 0).toFixed(1) + ' mm';
    document.getElementById('precipProb').textContent = 'Chance: ' + (d.precipprob != null ? Math.round(d.precipprob) + '%' : '—');

    const fcRow = document.getElementById('forecastRow');
    fcRow.innerHTML = '';
    data.days.slice(0, 7).forEach((day, i) => {
      const el = document.createElement('div');
      el.className = 'forecast-day' + (i === 0 ? ' today' : '');
      el.innerHTML = `
        <div class="forecast-day-name">${dayName(day.datetime, i)}</div>
        <div class="forecast-icon">${condIcon(day.conditions)}</div>
        <div class="forecast-high">${toDisplayShort(day.tempmax)}</div>
        <div class="forecast-low">${toDisplayShort(day.tempmin)}</div>
      `;
      fcRow.appendChild(el);
    });

    document.getElementById('saveCurrentBtn').disabled = false;
    showCards();
  }

  function showCards() {
    ['mainCard','cardHumidity','cardWind','cardUV','cardPrecip','forecastCard'].forEach((id, i) => {
      setTimeout(() => {
        const el = document.getElementById(id);
        el.classList.add('visible');
        el.style.animationDelay = '0s';
      }, i * 60);
    });
  }

  function hideCards() {
    ['mainCard','cardHumidity','cardWind','cardUV','cardPrecip','forecastCard'].forEach(id => {
      document.getElementById(id).classList.remove('visible');
    });
  }

  function setLoading(v, msg) {
    document.getElementById('loading').classList.toggle('visible', v);
    if (msg) document.getElementById('loadingText').textContent = msg;
  }

  function setError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.toggle('visible', !!msg);
  }

  // ============ FETCH ============
  async function fetchWeather(lat, lon) {
    let loc;
    if (lat != null && lon != null) {
      loc = `${lat},${lon}`;
    } else {
      loc = document.getElementById('locInput').value.trim();
      if (!loc) { setError('Please enter a location.'); return; }
    }

    hideCards(); setError('');
    setLoading(true, 'Fetching weather data…');

    const url = `https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/${encodeURIComponent(loc)}?unitGroup=us&include=days,current&key=${API_KEY}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Location not found or API key invalid.');
      const data = await res.json();
      lastData = data;
      renderAll(data);
    } catch (e) {
      setError('⚠️ ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  function useLocation() {
    if (!navigator.geolocation) { setError('Geolocation not supported.'); return; }
    hideCards(); setError('');
    setLoading(true, 'Getting your location…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        document.getElementById('locInput').value = '';
        fetchWeather(pos.coords.latitude, pos.coords.longitude);
      },
      () => {
        setLoading(false);
        setError('Could not get your location. Please allow location access or search manually.');
      }
    );
  }

  // ============ SAVED LOCATIONS ============
  function persistSaved() {
    try { localStorage.setItem('nimbus_saved', JSON.stringify(savedLocations)); } catch(e) {}
  }

  function renderSavedList() {
    const list = document.getElementById('savedList');
    const countEl = document.getElementById('savedCount');
    if (savedLocations.length === 0) {
      list.innerHTML = '<div class="no-saved">No saved locations yet.</div>';
      countEl.style.display = 'none';
      return;
    }
    countEl.textContent = savedLocations.length;
    countEl.style.display = 'flex';
    list.innerHTML = savedLocations.map((loc, i) => `
      <div class="saved-location-item" onclick="loadSaved(${i})">
        <span style="font-size:16px;">${condIcon(loc.cond)}</span>
        <span class="saved-loc-name">${loc.name}</span>
        <span class="saved-loc-temp">${loc.temp}</span>
        <button class="saved-loc-del" onclick="deleteSaved(event,${i})" title="Remove">✕</button>
      </div>
    `).join('');
  }

  function saveCurrentLocation() {
    if (!lastData) return;
    const name = formatLocationName(lastData.resolvedAddress);
    const query = lastData.resolvedAddress;
    const temp = toDisplay(lastData.currentConditions.temp);
    const cond = lastData.currentConditions.conditions;

    if (savedLocations.some(s => s.query === query)) {
      showToast('Already saved!'); return;
    }

    savedLocations.unshift({ name, query, temp, cond });
    if (savedLocations.length > 10) savedLocations.pop();
    persistSaved();
    renderSavedList();
    showToast('📍 ' + name + ' saved!');
  }

  function loadSaved(i) {
    const loc = savedLocations[i];
    document.getElementById('locInput').value = loc.name;
    closeSavedPanel();
    // Fetch by the stored query (handles coords too)
    const isCoord = /^-?\d+\.?\d*,\s*-?\d+\.?\d*$/.test(loc.query.trim());
    if (isCoord) {
      const [lat, lon] = loc.query.split(',').map(Number);
      fetchWeather(lat, lon);
    } else {
      fetchWeather();
    }
  }

  function deleteSaved(event, i) {
    event.stopPropagation();
    savedLocations.splice(i, 1);
    persistSaved();
    renderSavedList();
  }

  function toggleSavedPanel() {
    const panel = document.getElementById('savedPanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) renderSavedList();
  }

  function closeSavedPanel() {
    document.getElementById('savedPanel').classList.remove('open');
  }

  document.addEventListener('click', e => {
    const panel = document.getElementById('savedPanel');
    const btn = document.getElementById('savedBtn');
    if (!panel.contains(e.target) && !btn.contains(e.target)) closeSavedPanel();
  });

  // ============ TOAST ============
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // ============ INIT — auto detect location ============
  window.addEventListener('load', () => {
    renderSavedList();
    if (navigator.geolocation) {
      setLoading(true, 'Detecting your location…');
      navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => {
          setLoading(false);
          setError('');
          // Show hint without auto-loading Mysore
          document.getElementById('locInput').placeholder = 'Location access denied — search a city manually';
        },
        { timeout: 7000 }
      );
    }
  });
</script>
</body>
</html>
